<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#00ffff" />
  <title>Todo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label for="todo-input" class="visually-hidden" hidden>New todo</label>
      <input
        id="todo-input"
        name="todo"
        type="text"
        placeholder="Add a task…"
        aria-label="New todo"
        maxlength="200"
        required
      />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="todo-footer">
      <span id="count">0 items</span>
      <button id="clear-completed" type="button">Clear Completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
